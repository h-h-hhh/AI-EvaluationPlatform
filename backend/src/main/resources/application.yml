server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:codeeval;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: CodeEval@2026SecretKeyForJWTAuthentication
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.codeeval: DEBUG
    com.example.codeeval.security: DEBUG
    org.springframework.security: DEBUG

llm:
  provider: deepseek
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com/v1
  model: deepseek-coder
  temperature: 0.2
  max-tokens: 4000
  timeout: 60000