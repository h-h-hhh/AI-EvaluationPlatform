version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: codeeval-db
    environment:
      POSTGRES_DB: codeeval
      POSTGRES_USER: codeeval
      POSTGRES_PASSWORD: codeeval123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeeval"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  backend:
    build: ./backend
    container_name: codeeval-backend
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/codeeval
      DATABASE_USERNAME: codeeval
      DATABASE_PASSWORD: codeeval123
      JWT_SECRET: your-256-bit-secret-key-here-change-in-production
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  frontend:
    build: ./frontend
    container_name: codeeval-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

volumes:
  postgres_data:
    driver: local